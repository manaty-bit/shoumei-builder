</style></head><body><div id="app">
<header class="top"><div class="top-inner"><div class="identity"><div class="logo">Σ</div><div><h1>証明ビルダー</h1><p class="tagline">選ぶだけで終わらせない。自分の言葉で証明できるように。</p></div></div><div class="top-aux"><span class="vtag">LEVEL UP / VER.3</span><button class="topbtn" id="recordBtn">学習記録・認定証</button></div></div></header>
<div class="controls"><div class="controls-inner"><div class="sets"><div class="seg" role="group" aria-label="モード"><button id="buildTab" aria-pressed="true">✎ 証明をつくる</button><button id="findTab" aria-pressed="false">⌕ 間違いを修復</button></div><div class="seg level" role="group" aria-label="難易度"><button id="basicTab">LEVEL 1 基礎</button><button id="advancedTab">LEVEL 2 発展</button></div></div><span class="smallstats" id="stats"></span></div></div>
<main class="container"><nav id="stagebar" class="stagebar" aria-label="証明の練習段階"></nav><div class="workspace"><section class="card"><div class="card-body" id="problem"></div></section><section class="card"><div class="work-head"><div><h2 id="workTitle"></h2><p id="workDesc"></p></div><span class="count" id="workCount"></span></div><div class="work-body" id="work"></div></section></div></main><footer class="footer">記録はこの端末のブラウザ内に保存されます。自由記述は自動採点ではなく、模範解答との自己照合です。</footer>
</div><div id="modalRoot"></div>
<script>
const S=(label,correct,wrong,why)=>({label,correct,wrong,why});
const P=(id,title,statement,steps,focus)=>({id,title,statement,steps,focus});
const PROOFS={
basic:[
P('b01','奇数 ＋ 奇数','「奇数と奇数の和は偶数である」ことを証明しよう。',[
 S('文字で奇数を表す','m、n を整数とすると、2つの奇数は 2m＋1、2n＋1 と表せる。',['m、n を整数とすると、2つの奇数は 2m、2n と表せる。','n を整数とすると、2つの奇数は 2n＋1、2n＋1 と表せる。','m、n を正の整数とすると、すべての奇数は 2m＋1、2n＋1 と表せる。'],'任意の2つの奇数には、別々の整数 m、n を使います。'),
 S('和を計算する','その和は、(2m＋1)＋(2n＋1)＝2m＋2n＋2。',['その和は、(2m＋1)＋(2n＋1)＝2m＋2n＋1。','その和は、(2m＋1)＋(2n＋1)＝4mn＋2。','その和は、(2m＋1)＋(2n＋1)＝2m＋2n。'],'同類項をまとめると、定数部分は 1＋1＝2 です。'),
 S('偶数の形にする','2m＋2n＋2＝2(m＋n＋1)。',['2m＋2n＋2＝2(m＋n＋2)。','2m＋2n＋2＝2(m＋n)＋1。','2m＋2n＋2＝2(mn＋1)。'],'「2×整数」の形にくくります。'),
 S('整数であることを説明する','m＋n＋1 は整数だから、2(m＋n＋1) は偶数である。',['m＋n＋1 は必ず奇数だから、和は偶数である。','m＋n＋1 は必ず正の整数だから、和は偶数である。','m＋n＋1 は整数だから、2(m＋n＋1) は奇数である。'],'m、n が整数なら、m＋n＋1 も整数です。'),
 S('結論を述べる','したがって、奇数と奇数の和は偶数である。',['したがって、奇数と奇数の積は偶数である。','したがって、奇数と奇数の和は奇数である。','したがって、奇数と奇数の和は4の倍数である。'],'最初に証明したかったことを、正確に書きます。')
],'別々の奇数には別々の文字'),
P('b02','奇数 ＋ 偶数','「奇数と偶数の和は奇数である」ことを証明しよう。',[
 S('奇数と偶数を表す','m、n を整数とすると、奇数は 2m＋1、偶数は 2n と表せる。',['m、n を整数とすると、奇数は 2m、偶数は 2n＋1 と表せる。','m、n を整数とすると、奇数も偶数も 2m＋1 と表せる。','m、n を正の整数とすると、すべての奇数・偶数を表せる。'],'奇数は「2×整数＋1」、偶数は「2×整数」です。'),
 S('和を計算する','その和は、(2m＋1)＋2n＝2m＋2n＋1。',['その和は、(2m＋1)＋2n＝4mn＋1。','その和は、(2m＋1)＋2n＝2m＋2n＋2。','その和は、(2m＋1)＋2n＝2(m＋n)。'],'展開してから偶数の部分をまとめます。'),
 S('奇数の形にする','2m＋2n＋1＝2(m＋n)＋1。',['2m＋2n＋1＝2(m＋n＋1)。','2m＋2n＋1＝2(mn)＋1。','2m＋2n＋1＝2(m＋n＋1)＋1。'],'2k＋1（k は整数）の形を目指します。'),
 S('整数の条件を使う','m＋n は整数だから、2(m＋n)＋1 は奇数である。',['m＋n は偶数だから、2(m＋n)＋1 は奇数である。','m＋n は整数だから、2(m＋n)＋1 は偶数である。','m＋n は正の整数だから、2(m＋n)＋1 は奇数である。'],'m＋n は整数ですが、偶数とは限りません。'),
 S('結論を述べる','したがって、奇数と偶数の和は奇数である。',['したがって、奇数と偶数の和は偶数である。','したがって、奇数と偶数の積は奇数である。','したがって、奇数と偶数の和は3の倍数である。'],'結論は問題文と一致させます。')
],'奇数の形 2k＋1'),
P('b03','偶数 ＋ 偶数','「偶数と偶数の和は偶数である」ことを証明しよう。',[
 S('2つの偶数を表す','m、n を整数とすると、2つの偶数は 2m、2n と表せる。',['m、n を整数とすると、2つの偶数は 2m＋1、2n＋1 と表せる。','n を整数とすると、2つの偶数はどちらも 2n と表せる。','m、n を自然数とすると、すべての偶数は 2m、2n と表せる。'],'負の偶数や0も含むため、文字は整数とします。'),
 S('和を計算する','2つの偶数の和は、2m＋2n。',['2つの偶数の和は、2mn。','2つの偶数の和は、2m＋n。','2つの偶数の和は、4m＋n。'],'和と積を取り違えないようにします。'),
 S('偶数の形にする','2m＋2n＝2(m＋n)。',['2m＋2n＝2mn。','2m＋2n＝4(m＋n)。','2m＋2n＝2(m＋n＋1)。'],'共通な2でくくります。'),
 S('整数であることを説明する','m＋n は整数だから、2(m＋n) は偶数である。',['m＋n は奇数だから、2(m＋n) は偶数である。','m＋n は整数だから、2(m＋n) は奇数である。','m＋n は必ず正の整数だから、2(m＋n) は偶数である。'],'整数を2倍した数が偶数です。'),
 S('結論を述べる','したがって、偶数と偶数の和は偶数である。',['したがって、偶数と偶数の和は奇数である。','したがって、偶数と偶数の積は4の倍数である。','したがって、偶数と偶数の和は4の倍数である。'],'今回示したのは「和」についてです。')
],'偶数は 2×整数'),
P('b04','偶数 × 偶数','「偶数と偶数の積は4の倍数である」ことを証明しよう。',[
 S('2つの偶数を表す','m、n を整数とすると、2つの偶数は 2m、2n と表せる。',['m、n を整数とすると、2つの偶数は m＋2、n＋2 と表せる。','m、n を整数とすると、2つの偶数は 2m＋1、2n＋1 と表せる。','n を整数とすると、2つの偶数は必ず同じ 2n である。'],'別々の偶数を2m、2nと表します。'),
 S('積を計算する','その積は、2m×2n＝4mn。',['その積は、2m×2n＝2mn。','その積は、2m×2n＝4(m＋n)。','その積は、2m×2n＝4m＋4n。'],'係数は 2×2＝4、文字は mn になります。'),
 S('4の倍数の形を確認する','4mn＝4×(mn) と表せる。',['4mn＝4×(m＋n) と表せる。','4mn＝4×(m＋n＋1) と表せる。','4mn＝4×(2mn) と表せる。'],'「4×整数」の形になっています。'),
 S('整数であることを説明する','mn は整数だから、4mn は4の倍数である。',['mn は必ず偶数だから、4mn は4の倍数である。','mn は整数だから、4mn は奇数である。','mn は自然数だから、4mn は4の倍数である。'],'整数どうしの積 mn は整数です。'),

],'積の中に4を見つける'),
P('b05','7の倍数の差','「7の倍数どうしの差は7の倍数である」ことを証明しよう。',[
 S('7の倍数を表す','m、n を整数とすると、2つの7の倍数は 7m、7n と表せる。',['m、n を整数とすると、2つの7の倍数は 7＋m、7＋n と表せる。','m、n を整数とすると、2つの7の倍数は 7m＋1、7n＋1 と表せる。','m、n を自然数とすると、すべての7の倍数が表せる。'],'7の倍数は「7×整数」です。'),
 S('差を計算する','その差は、7m－7n。',['その差は、7m＋7n。','その差は、7mn。','その差は、7m－n。'],'「差」は前の数から後の数を引きます。'),
 S('7の倍数の形にする','7m－7n＝7(m－n)。',['7m－7n＝7(m＋n)。','7m－7n＝7(mn)。','7m－7n＝7(m－n＋1)。'],'7をくくり出します。'),
 S('整数の条件を使う','m－n は整数だから、7(m－n) は7の倍数である。',['m－n は必ず自然数だから、7(m－n) は7の倍数である。','m－n は整数だから、7(m－n) は7の余り1の数である。','m－n は必ず正だから、7(m－n) は7の倍数である。'],'差が負でも0でも、整数なら倍数として扱えます。'),
 S('結論を述べる','したがって、7の倍数どうしの差は7の倍数である。',['したがって、7の倍数どうしの差は7の倍数ではない。','したがって、7の倍数どうしの差は必ず正である。','したがって、7の倍数どうしの積は7の倍数である。'],'示すべき結論を明記します。')
],'倍数＝その数×整数'),
P('b06','連続する3つの整数','「連続する3つの整数の和は3の倍数である」ことを証明しよう。',[
 S('連続する3つの整数を表す','n を整数とすると、連続する3つの整数は n、n＋1、n＋2 と表せる。',['n を整数とすると、連続する3つの整数は n、n＋1、n＋3 と表せる。','n を整数とすると、連続する3つの整数は n、2n、3n と表せる。','n を正の整数とすると、すべての連続する3つの整数を表せる。'],'1ずつ増えるのが「連続する整数」です。'),
 S('和を計算する','その和は、n＋(n＋1)＋(n＋2)＝3n＋3。',['その和は、n＋(n＋1)＋(n＋2)＝3n＋2。','その和は、n＋(n＋1)＋(n＋2)＝n³＋3。','その和は、n＋(n＋1)＋(n＋2)＝3n＋1。'],'文字nが3個、定数部分は 0＋1＋2＝3。'),
 S('3の倍数の形にする','3n＋3＝3(n＋1)。',['3n＋3＝3(n＋3)。','3n＋3＝3n(n＋1)。','3n＋3＝3(n＋2)。'],'3でくくり出します。'),
 S('整数の条件を使う','n＋1 は整数だから、3(n＋1) は3の倍数である。',['n＋1 は必ず3の倍数だから、3(n＋1) は3の倍数である。','n＋1 は整数だから、3(n＋1) は奇数である。','n＋1 は必ず正の整数だから、3(n＋1) は3の倍数である。'],'nが整数なら n＋1 も整数です。'),
 S('結論を述べる','したがって、連続する3つの整数の和は3の倍数である。',['したがって、連続する3つの整数の和は必ず6の倍数である。','したがって、連続する3つの整数の積は3の倍数である。','したがって、連続する3つの整数の和は奇数である。'],'どの整数から始めても成り立つことを示せました。')
],'連続する整数は +1ずつ'),
P('b07','連続する5つの整数','「連続する5つの整数の和は5の倍数である」ことを証明しよう。',[
 S('真ん中の整数を決める','n を整数とすると、5つの整数は n－2、n－1、n、n＋1、n＋2 と表せる。',['n を整数とすると、5つの整数は n－3、n－1、n、n＋1、n＋2 と表せる。','n を整数とすると、5つの整数は n、n＋2、n＋4、n＋6、n＋8 と表せる。','n を整数とすると、5つの整数は n－2、n－1、n、n＋1、n＋3 と表せる。'],'真ん中をnとすると、左右が対称になります。'),
 S('和を計算する','その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝5n。',['その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝5n＋2。','その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝5n＋5。','その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝n⁵。'],'定数の －2、－1、0、＋1、＋2 は打ち消し合います。'),
 S('5の倍数の形を見る','5n＝5×n と表せる。',['5n＝5＋n と表せる。','5n＝5×(n＋1) と表せる。','5n＝5×(n－1) と表せる。'],'すでに5×整数の形です。'),
 S('文字の条件を使う','n は整数だから、5n は5の倍数である。',['n は整数だから、5n は必ず奇数である。','n は必ず5の倍数だから、5n は5の倍数である。','n は正の整数だから、5n は5の倍数である。'],'nが負でも0でも成立します。'),
 S('結論を述べる','したがって、連続する5つの整数の和は5の倍数である。',['したがって、連続する5つの整数の和は必ず10の倍数である。','したがって、連続する5つの整数の和は必ず奇数である。','したがって、連続する5つの整数の積は5の倍数である。'],'「和」が5の倍数になることを示しました。')
],'真ん中をnにして対称に'),
P('b08','7で割った余り','「7で割ると余りが3の整数と、余りが4の整数の和は7の倍数になる」ことを証明しよう。',[
 S('余りのある整数を表す','m、n を整数とすると、2つの数は 7m＋3、7n＋4 と表せる。',['m、n を整数とすると、2つの数は 7m＋4、7n＋3 と表せる。','m、n を整数とすると、2つの数は 3m＋7、4n＋7 と表せる。','m、n を整数とすると、2つの数は 7m、7n と表せる。'],'「割る数×整数＋余り」を使います。'),

 S('7の倍数の形にする','7m＋7n＋7＝7(m＋n＋1)。',['7m＋7n＋7＝7(m＋n＋7)。','7m＋7n＋7＝7(m＋n)＋1。','7m＋7n＋7＝7(mn＋1)。'],'7でくくります。'),
 S('整数の条件を使う','m＋n＋1 は整数だから、7(m＋n＋1) は7の倍数である。',['m＋n＋1 は必ず7の倍数だから、和は7の倍数である。','m＋n＋1 は必ず正の整数だから、和は7の倍数である。','m＋n＋1 は整数だから、7(m＋n＋1) は余り1の整数である。'],'余りの和が7なら、全体は7の倍数です。'),
 S('結論を述べる','したがって、2つの整数の和は7の倍数になる。',['したがって、2つの整数の差は7の倍数になる。','したがって、2つの整数の和は余り7になる。','したがって、2つの整数の和は14の倍数になる。'],'余りは7より小さくなくてはいけません。')
],'余りを足して、倍数の形へ')

advanced:[
P('a01','2けたの数を入れ替えて足す','「2けたの自然数と、十の位・一の位の数字を入れ替えた数との和は11の倍数である」ことを証明しよう。',[
 S('各位の数字を表す','十の位の数字を a、一の位の数字を b とする。a は1以上9以下、b は0以上9以下の整数である。',['a、b はともに1以上9以下の整数である。','a、b はともに0以上10以下の整数である。','a は0以上9以下、b は1以上9以下の整数である。'],'十の位は0にできません。一の位は0でも構いません。'),
 S('元の整数を表す','元の2けたの自然数は 10a＋b と表せる。',['元の2けたの自然数は a＋10b と表せる。','元の2けたの自然数は 100a＋b と表せる。','元の2けたの自然数は 10(a＋b) と表せる。'],'十の位は10倍します。'),
 S('入れ替えた数を表す','数字を入れ替えた数は 10b＋a と表せる。',['数字を入れ替えた数は 10a＋b と表せる。','数字を入れ替えた数は 100b＋a と表せる。','数字を入れ替えた数は b＋10ab と表せる。'],'十の位がb、一の位がaになります。'),
 S('和を因数分解する','(10a＋b)＋(10b＋a)＝11a＋11b＝11(a＋b)。',['(10a＋b)＋(10b＋a)＝11a＋10b。','(10a＋b)＋(10b＋a)＝10(a＋b)。','(10a＋b)＋(10b＋a)＝11(a－b)。'],'11を共通因数にもつ形にします。'),
 S('結論まで書く','a＋b は整数だから、11(a＋b) は11の倍数である。したがって、求める和は11の倍数である。',['a＋b は必ず11の倍数だから、求める和は11の倍数である。','a＋b は整数だから、11(a＋b) は9の倍数である。','a－b は整数だから、求める和は11の倍数である。'],'最後に必ず「文字が整数」という理由を入れます。')

P('a02','2けたの数を入れ替えて引く','「2けたの自然数と、各位の数字を入れ替えた数との差は9の倍数である」ことを証明しよう。',[
 S('位の数字を決める','a は1以上9以下、b は0以上9以下の整数とし、十の位を a、一の位を b とする。',['a、b はともに0以上9以下の整数とする。','a、b はともに1以上10以下の整数とする。','a は0以上9以下、b は1以上9以下の整数とする。'],'元の数が2けたになるため、a は0ではありません。'),
 S('元の数と入れ替えた数を表す','元の数は 10a＋b、入れ替えた数は 10b＋a と表せる。',['元の数は a＋b、入れ替えた数は b＋a と表せる。','元の数は 10a＋b、入れ替えた数は 10a＋b と表せる。','元の数は 10a＋b、入れ替えた数は 100b＋a と表せる。'],'各位の数字の位置に着目します。'),

 S('9の倍数の形にする','10a＋b－10b－a＝9a－9b＝9(a－b)。',['10a＋b－10b－a＝9(a＋b)。','10a＋b－10b－a＝9(a－b)＋1。','10a＋b－10b－a＝9(a－10b)。'],'差の形では a－b が残ります。'),
 S('理由と結論をまとめる','a－b は整数だから、9(a－b) は9の倍数である。したがって、求める差は9の倍数である。',['a－b は必ず正の整数だから、求める差は9の倍数である。','a－b は整数だから、求める差は11の倍数である。','a＋b は整数だから、求める差は9の倍数である。'],'差が負の場合も、9の倍数に含みます。')
],'マイナスの分配に注意'),
P('a03','3けたの百・十の位を入れ替える','「3けたの整数と、その百の位・十の位を入れ替えた数との差は90の倍数である」ことを証明しよう。',[
 S('3つの位の数字を決める','百の位を a、十の位を b、一の位を c とする。a は1以上9以下、b、c は0以上9以下の整数である。',['a、b、c はすべて0以上9以下の整数である。','a、b、c はすべて1以上9以下の整数である。','a は0以上9以下、b は1以上9以下、c は0以上9以下の整数である。'],'3けたであるため、百の位のaだけは0を除きます。'),

 S('位を入れ替えた数を表す','入れ替えた数は 100b＋10a＋c と表せる。',['入れ替えた数は 100c＋10b＋a と表せる。','入れ替えた数は 100a＋10c＋b と表せる。','入れ替えた数は 100b＋10c＋a と表せる。'],'百の位と十の位だけを交換します。'),

 S('理由と結論を述べる','a－b は整数だから、90(a－b) は90の倍数である。したがって、求める差は90の倍数である。',['a－b は必ず自然数だから、求める差は90の倍数である。','a＋b は整数だから、求める差は90の倍数である。','a－b は整数だから、求める差は9の倍数でしかない。'],'整数の差は整数です。')
],'100と10の差は90'),

 S('文字と条件を決める','百の位を a、十の位を b、一の位を c とする。a は1以上9以下、b、c は0以上9以下の整数である。',['a、b、c はすべて0以上9以下の整数である。','a、b、c はすべて1以上9以下の整数である。','a は0以上9以下、b、c は1以上9以下の整数である。'],'数字の条件を正しく指定します。'),
 S('整数と数字の和を表す','元の整数は 100a＋10b＋c、各位の数字の和は a＋b＋c である。',['元の整数は 100a＋10b＋c、各位の数字の和は 100a＋10b＋c である。','元の整数は 10a＋100b＋c、各位の数字の和は a＋b＋c である。','元の整数は 100a＋10b＋c、各位の数字の和は ab＋c である。'],'数字そのものの和は a＋b＋c。'),

],'100＝99＋1、10＝9＋1'),

function diagramFor(id,isTransfer){if(!id.startsWith('a')||Number(id.slice(1))<9)return null;const wrap=make('div');wrap.append(make('p','chart-title','図の規則を読もう'));const chart=make('div','pattern');let note='';const mkTable=(rows,cols,value,highlight,headers)=>{const table=document.createElement('table');const body=document.createElement('tbody');if(headers){const tr=document.createElement('tr');tr.append(make('th','',''));for(let c=0;c<cols;c++)tr.append(make('th','',String(2*c+1)));body.append(tr)}for(let r=0;r<rows;r++){const tr=document.createElement('tr');if(headers)tr.append(make('th','',String(2*(r+1))));for(let c=0;c<cols;c++){let v=value(r,c);const td=make('td',highlight(r,c)?'hit':(v==null?'dim':''),v==null?'':String(v));tr.append(td)}body.append(tr)}table.append(body);return table};
 if(id==='a09'){chart.append(mkTable(4,6,(r,c)=>2*(6*r+c)+1,(r,c)=>(r===1||r===2)&&(c===1||c===2)));note='横に2、縦に12増える。色の4マスは例。'}
 if(id==='a10'){const cols=isTransfer?5:7;chart.append(mkTable(4,cols,(r,c)=>cols*r+c+1,(r,c)=>(r===1||r===2)&&(c===1||c===2)));note=`${cols}列ごとに次の段へ。色の4マスは例。`}
 if(id==='a11'){chart.append(mkTable(5,7,(r,c)=>{const val=r*7+c-1;return val>=1&&val<=31?val:null},(r,c)=>isTransfer?c===3&&(r===1||r===2||r===3):(r===1&&(c===2||c===3))||(r===2&&c===3)));note=isTransfer?'縦3マスを考える（同じ月に存在する位置）。':'右へ1、下へ7進むL字型。'}
 if(id==='a12'){const ns=4,unit=isTransfer?40:70,height=isTransfer?40:28;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${unit*ns+20} ${height*ns+25}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',`${ns}段まで積んだ階段状の${isTransfer?'正方形':'長方形'}`);for(let r=0;r<ns;r++){const count=r+1;for(let c=0;c<count;c++){const x=10+(ns-count)*unit/2+c*unit,y=10+r*height;const e=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of [['x',x],['y',y],['width',unit],['height',height],['fill','#f5f8ff'],['stroke','#3d608b'],['stroke-width','1.7']])e.setAttribute(k,v);svg.appendChild(e)}}chart.append(svg);note=isTransfer?'1cm×1cmの正方形で4段の例。':'横2cm・縦1cmの長方形で4段の例。'}
 if(id==='a13'){chart.append(mkTable(4,4,(r,c)=>2*(r+1)+2*(c+1)-1,(r,c)=>(r===1||r===2)&&(c===1||c===2),true));note='行・列ともに1つ進むと2増える。'}
 wrap.append(chart,make('p','diagram-note',note));return wrap}

function openRecords(){const host=$('modalRoot');host.replaceChildren();const cover=make('div','overlay');const dlg=make('div','dialog');dlg.setAttribute('role','dialog');dlg.setAttribute('aria-modal','true');dlg.setAttribute('aria-label','学習記録と認定証');const top=make('div','dialog-controls actionrow');top.append(make('h2','','学習記録・認定証'),btn('閉じる ✕','subbtn',()=>host.replaceChildren()));dlg.append(top);dlg.append(make('p','','「自分で白紙答案を照合した」記録と、「誤りを修復した」記録です。機械による採点結果ではありません。'));const namebox=make('div','name-container');namebox.append(make('label','field-label','プレイヤー名（認定証に使用）'));const name=make('input','nameinput');name.value=progress.name||'';name.placeholder='名前を入力';name.maxLength=30;name.addEventListener('input',()=>{progress.name=name.value;save()});namebox.append(name);dlg.append(namebox);
 LEVELS.forEach(lvl=>{const {built,find,buildTotal,findTotal}=completionRate(lvl);const title=make('h3','',lvl==='basic'?'LEVEL 1 基礎':'LEVEL 2 発展');title.style.margin='18px 0 8px';dlg.append(title);const stats=make('div','kpi-grid');for(const [n,v,total] of [['白紙証明（自己照合）',built,buildTotal],['誤りの修復',find,findTotal]]){const k=make('div','kpi');k.append(make('b','',`${v}/${total}`),make('span','',n));const line=make('div','progressline');const fill=make('span');fill.style.width=(v/total*100)+'%';line.append(fill);k.append(line);stats.append(k)}dlg.append(stats);const passed=built===buildTotal&&find===findTotal;if(passed){const cert=make('div','certificate');cert.append(make('div','badge','PRACTICE COMPLETED'),make('h2','','学習達成記録'),make('p','',`${progress.name||'プレイヤー'} さん`),make('p','',`${lvl==='basic'?'基礎':'発展'}：全${buildTotal}題の白紙証明自己照合と、全${findTotal}題の誤り修復を記録しました。`),make('p','small',`記録日：${new Date().toLocaleDateString('ja-JP')}／証明ビルダー`));dlg.append(cert);const row=make('div','dialog-controls actionrow');row.append(btn('認定証を印刷・PDF保存','primary',()=>window.print()));dlg.append(row)}else{dlg.append(make('p','emptyhint','両方がすべて埋まると、このレベルの学習達成記録を印刷できます。'))}});cover.append(dlg);cover.addEventListener('click',e=>{if(e.target===cover)host.replaceChildren()});host.append(cover)}
