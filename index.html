*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #86acf9;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.44}.app{min-height:100dvh;display:flex;flex-direction:column}.header{background:linear-gradient(110deg,#0e1c30,#213e64);padding:15px max(18px,calc((100vw - 1530px)/2));color:white;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;gap:13px;align-items:center;min-width:0}.mark{display:grid;place-items:center;font-size:25px;font-weight:800;width:49px;height:49px;border:1px solid #527196;border-radius:14px;background:#ffffff14;flex-shrink:0}.header h1{font-size:clamp(19px,2vw,25px);margin:0;letter-spacing:.045em}.header .tag{font-size:12px;color:#b8c9e3;margin:4px 0 0}.version{font-size:11px;color:#d1e5ff;background:#ffffff19;border:1px solid #ffffff31;border-radius:40px;padding:7px 10px;white-space:nowrap}.toolbar{background:white;border-bottom:1px solid var(--line);padding:10px max(18px,calc((100vw - 1530px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.toggleSet{display:flex;gap:5px;background:#f1f4f9;border:1px solid #e5eaf3;padding:4px;border-radius:13px}.toggleSet button{border:0;border-radius:10px;padding:10px 18px;background:transparent;color:#657690;font-weight:800;font-size:14px;min-height:41px}.toggleSet button.active{background:white;color:#244eb8;box-shadow:0 2px 10px #183f7522}.levelButtons button.active{background:#244a77;color:white}.statLine{font-size:12px;font-weight:800;color:#687d99}.shell{max-width:1530px;margin:0 auto;width:100%;padding:18px;display:grid;grid-template-columns:minmax(0,.93fr) minmax(0,1.07fr);gap:17px;flex:1;align-items:stretch;min-height:0}.panel{border:1px solid var(--line);border-radius:20px;background:white;box-sha var(--sea-pale);border:1px solid #a7e5cb}.feedback.bad{color:#9a3244;background:var(--red-pale);border:1px solid #f1bac4}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;flex-wrap:wrap}.primary{border:0;border-radius:12px;background:var(--blue);color:white;font-size:14px;font-weight:850;padding:12px 18px;min-height:47px}.primary:hover{background:#2458d5}.primary.green{background:#0a9277}.primary.green:hover{background:#087b66}.caption{font-size:12px;color:#71829a;line-height:1.55}.paper{background:linear-gradient(170deg,#fff,#fafcff)}.paperHeader{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.paperHeader h2{font-size:18px;margin:0}.paperHeader p{color:var(--sub);font-size:12px;margin:6px 0 0;line-height:1.55}.paperCount{background:#edf2f9;border-radius:30px;color:#557193;font-size:12px;padding:7px 10px;white-space:nowrap;font-weight:800}.paperBody{padding:20px 22px 26px;min-height:320px;overflow:auto;flex:1}.paperMark{display:flex;justify-content:space-between;gap:12px;color:#8294ac;font-size:11px;letter-spacing:.10em;font-weight:900;margin:0 0 14px}.proofline{border:1px solid #dfe7f2;border-radius:12px;background:white;display:flex;align-items:flex-start;gap:12px;margin:0 0 10px;padding:15px 15px;line-height:1.74;font-size:clamp(13px,1.08vw,16px);white-space:pre-line;word-break:normal;overflow-wrap:anywhere}.proofline .num{flex-shrink:0;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:850;background:#eaf0f8;color:#607899}.proofline.done{border-color:#a0ddc3;background:#f6fff9}.proofline.done .num{background:#14aa86;color:white}.proofline.next{border-style:dashed;border-color:#a9bfee;background:#f8faff}.proofline.next .num{background:#dce8ff;color:#305dc0}.proofline.blank{color:#9aa9ba;border-style:dashed}.proofline.errorPick{width:100%;text-align:left;cursor:pointer;transition:background .12s,border-color .12s}.proofline.errorPick:hover:not(:disabled){background:#f2f6ff;border-color:#93b3e9}.proofline.errorPick:disabled{opacity:1;cursor:default}.proofline.errorPick.wrongGuess{border-color:#efb9c3;background:#fff2f3}.proofline.errorPick.revealed{border:2px solid #db6474;background:var(--red-pale)}.proofline.errorPick.revealed .num{color:white;background:var(--red)}.proofline.errorPick .pickIcon{margin-left:auto;flex-shrink:0;color:#8699b3;font-size:18px}.paperFooter{padding:13px 22px;background:#eef3fa;border-top:1px solid var(--line);font-size:12px;color:#527197;line-height:1.65}.paperFooter strong{color:#315478}.explain{margin-top:12px;padding:15px 16px;border:1px solid #f1b9c1;border-radius:13px;background:#fff7f7}.explain h3{font-size:14px;margin:0 0 7px;color:#a02e42}.explain .repair{font-size:15px;font-weight:850;line-height:1.65;color:#183b66;margin-bottom:7px}.explain p{font-size:13px;line-height:1.7;margin:0;color:#72525e}.questionList{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.qchip{min-height:42px;border:1px solid #d2deec;border-radius:10px;background:white;color:#526984;font-size:12px;font-weight:800}.qchip.current{background:#eaf0ff;border-color:#668dea;color:#1f55b7}.qchip.solved{background:#e4f8ef;border-color:#a8e5cc;color:#16785d}.listLabel{font-size:13px;font-weight:800;color:#61768e;margin:0 0 8px}.congrats{text-align:center;border:1px solid #aee1cb;background:#edfff6;border-radius:15px;padding:22px 14px;margin-top:6px}.congrats .symbol{font-size:35px}.congrats h3{margin:7px 0 4px;color:#11735a}.congrats p{margin:0;color:#437567;font-size:13px;line-height:1.65}.tipBox{border:1px solid #ead6a9;border-radius:13px;background:#fffbf0;padding:14px 16px;font-size:13px;color:#75613b;line-height:1.75}.tipBox b{color:#8f611a}.overview{font-size:14px;line-height:1.7;color:#4e6581}.pill{background:#f1f4fa;color:#566b85;font-size:12px;font-weight:800;border-radius:9px;padding:6px 10px}.summaryRow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.smallStat{display:flex;align-items:center;gap:8px;font-size:12px;color:#6682a0}.dot{width:8px;height:8px;border-radius:50%;background:#1eaf85}.onlyMobile{display:none}@media(min-width:1050px) and (min-height:735px){.shell{height:calc(100dvh - 147px)}.panel{height:100%}.questionPanel{overflow:auto}}@media(max-width:1049px){.shell{grid-template-columns:1fr;gap:12px}.panel{overflow:visible}.paperBody{max-height:none}.paper{order:2}.questionPanel{order:1}.onlyMobile{display:inline}.choice{font-size:15px}}@media(max-width:630px){.header{padding:12px 15px}.mark{height:40px;width:40px;font-size:22px}.header .tag{font-size:10px}.header h1{font-size:20px}.version{font-size:10px;padding:6px 7px}.toolbar{padding:9px 12px;gap:8px}.toggleSet{flex:1;justify-content:stretch}.toggleSet button{flex:1;padding:9px 7px;font-size:12px}.levelButtons button{font-size:12px}.statLine{width:100%;text-align:right}.shell{padding:11px}.questionPanel{padding:16px;gap:13px}.questionTitle{font-size:22px}.statement{padding:12px 13px;font-size:15px}.choice{padding:13px 12px;font-size:14px;min-height:55px}.choice .letter{width:25px;height:25px}.paperHeader{padding:15px}.paperBody{padding:13px}.paperFooter{padding:12px 15px}.proofline{font-size:14px;padding:12px 11px}.questionList{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
<header class="header"><div class="brand"><div class="mark">∴</div><div><h1>証明ビルダー</h1><p class="tag">選ぶ → 考える → つながる。整数の証明トレーニング</p></div></div><span class="version">VERSION 2.0</span></header>
<div class="toolbar">
<div class="toggleSet" aria-label="学習モード"><button id="modeBuild" class="active" type="button">✦ 証明をつくる</button><button id="modeFind" type="button">⌕ 間違いを見抜く</button></div>
<div class="toggleSet levelButtons" aria-label="問題レベル"><button id="levelBasic" class="active" type="button">LEVEL 1 基礎</button><button id="levelAdvanced" type="button">LEVEL 2 発展</button></div>
<div class="statLine" id="stats">達成 0 / 8 問</div>
</div>
<main class="shell">
<section class="panel questionPanel" id="leftPanel" aria-label="問題と選択肢"></section>
<section class="panel paper" id="rightPanel" aria-label="証明ノート"><header class="paperHeader"><div><h2 id="paperTitle">組み立て中の証明</h2><p id="paperSub">正しい文章が1行ずつ増えていきます。</p></div><span class="paperCount" id="paperCount">0 / 5 行</span></header><div class="paperBody" id="paperBody"></div><footer class="paperFooter" id="paperFooter"></footer></section>
</main>
</div>
<script>
'use strict';
// 1つの選択で証明文を1行ずつ追加する。式だけでなく、文字の条件・理由・結論も問う。
const S=(label,correct,wrong,why)=>({label,correct,wrong,why});
const P=(id,title,statement,steps,focus)=>({id,title,statement,steps,focus});
const PROOFS={
basic:[
P('b01','奇数 ＋ 奇数','「奇数と奇数の和は偶数である」ことを証明しよう。',[
 S('文字で奇数を表す','m、n を整数とすると、2つの奇数は 2m＋1、2n＋1 と表せる。',['m、n を整数とすると、2つの奇数は 2m、2n と表せる。','n を整数とすると、2つの奇数は 2n＋1、2n＋1 と表せる。','m、n を正の整数とすると、すべての奇数は 2m＋1、2n＋1 と表せる。'],'任意の2つの奇数には、別々の整数 m、n を使います。'),
 S('和を計算する','その和は、(2m＋1)＋(2n＋1)＝2m＋2n＋2。',['その和は、(2m＋1)＋(2n＋1)＝2m＋2n＋1。','その和は、(2m＋1)＋(2n＋1)＝4mn＋2。','その和は、(2m＋1)＋(2n＋1)＝2m＋2n。'],'同類項をまとめると、定数部分は 1＋1＝2 です。'),
 S('偶数の形にする','2m＋2n＋2＝2(m＋n＋1)。',['2m＋2n＋2＝2(m＋n＋2)。','2m＋2n＋2＝2(m＋n)＋1。','2m＋2n＋2＝2(mn＋1)。'],'「2×整数」の形にくくります。'),
 S('整数であることを説明する','m＋n＋1 は整数だから、2(m＋n＋1) は偶数である。',['m＋n＋1 は必ず奇数だから、和は偶数である。','m＋n＋1 は必ず正の整数だから、和は偶数である。','m＋n＋1 は整数だから、2(m＋n＋1) は奇数である。'],'m、n が整数なら、m＋n＋1 も整数です。'),
 S('結論を述べる','したがって、奇数と奇数の和は偶数である。',['したがって、奇数と奇数の積は偶数である。','したがって、奇数と奇数の和は奇数である。','したがって、奇数と奇数の和は4の倍数である。'],'最初に証明したかったことを、正確に書きます。')
],'別々の奇数には別々の文字'),
P('b02','奇数 ＋ 偶数','「奇数と偶数の和は奇数である」ことを証明しよう。',[
 S('奇数と偶数を表す','m、n を整数とすると、奇数は 2m＋1、偶数は 2n と表せる。',['m、n を整数とすると、奇数は 2m、偶数は 2n＋1 と表せる。','m、n を整数とすると、奇数も偶数も 2m＋1 と表せる。','m、n を正の整数とすると、すべての奇数・偶数を表せる。'],'奇数は「2×整数＋1」、偶数は「2×整数」です。'),
 S('和を計算する','その和は、(2m＋1)＋2n＝2m＋2n＋1。',['その和は、(2m＋1)＋2n＝4mn＋1。','その和は、(2m＋1)＋2n＝2m＋2n＋2。','その和は、(2m＋1)＋2n＝2(m＋n)。'],'展開してから偶数の部分をまとめます。'),
 S('奇数の形にする','2m＋2n＋1＝2(m＋n)＋1。',['2m＋2n＋1＝2(m＋n＋1)。','2m＋2n＋1＝2(mn)＋1。','2m＋2n＋1＝2(m＋n＋1)＋1。'],'2k＋1（k は整数）の形を目指します。'),
 S('整数の条件を使う','m＋n は整数だから、2(m＋n)＋1 は奇数である。',['m＋n は偶数だから、2(m＋n)＋1 は奇数である。','m＋n は整数だから、2(m＋n)＋1 は偶数である。','m＋n は正の整数だから、2(m＋n)＋1 は奇数である。'],'m＋n は整数ですが、偶数とは限りません。'),
 S('結論を述べる','したがって、奇数と偶数の和は奇数である。',['したがって、奇数と偶数の和は偶数である。','したがって、奇数と偶数の積は奇数である。','したがって、奇数と偶数の和は3の倍数である。'],'結論は問題文と一致させます。')
],'奇数の形 2k＋1'),
P('b03','偶数 ＋ 偶数','「偶数と偶数の和は偶数である」ことを証明しよう。',[
 S('2つの偶数を表す','m、n を整数とすると、2つの偶数は 2m、2n と表せる。',['m、n を整数とすると、2つの偶数は 2m＋1、2n＋1 と表せる。','n を整数とすると、2つの偶数はどちらも 2n と表せる。','m、n を自然数とすると、すべての偶数は 2m、2n と表せる。'],'負の偶数や0も含むため、文字は整数とします。'),
 S('和を計算する','2つの偶数の和は、2m＋2n。',['2つの偶数の和は、2mn。','2つの偶数の和は、2m＋n。','2つの偶数の和は、4m＋n。'],'和と積を取り違えないようにします。'),
 S('偶数の形にする','2m＋2n＝2(m＋n)。',['2m＋2n＝2mn。','2m＋2n＝4(m＋n)。','2m＋2n＝2(m＋n＋1)。'],'共通な2でくくります。'),
 S('整数であることを説明する','m＋n は整数だから、2(m＋n) は偶数である。',['m＋n は奇数だから、2(m＋n) は偶数である。','m＋n は整数だから、2(m＋n) は奇数である。','m＋n は必ず正の整数だから、2(m＋n) は偶数である。'],'整数を2倍した数が偶数です。'),
 S('結論を述べる','したがって、偶数と偶数の和は偶数である。',['したがって、偶数と偶数の和は奇数である。','したがって、偶数と偶数の積は4の倍数である。','したがって、偶数と偶数の和は4の倍数である。'],'今回示したのは「和」についてです。')
],'偶数は 2×整数'),
P('b04','偶数 × 偶数','「偶数と偶数の積は4の倍数である」ことを証明しよう。',[
 S('2つの偶数を表す','m、n を整数とすると、2つの偶数は 2m、2n と表せる。',['m、n を整数とすると、2つの偶数は m＋2、n＋2 と表せる。','m、n を整数とすると、2つの偶数は 2m＋1、2n＋1 と表せる。','n を整数とすると、2つの偶数は必ず同じ 2n である。'],'別々の偶数を2m、2nと表します。'),
 S('積を計算する','その積は、2m×2n＝4mn。',['その積は、2m×2n＝2mn。','その積は、2m×2n＝4(m＋n)。','その積は、2m×2n＝4m＋4n。'],'係数は 2×2＝4、文字は mn になります。'),
 S('4の倍数の形を確認する','4mn＝4×(mn) と表せる。',['4mn＝4×(m＋n) と表せる。','4mn＝4×(m＋n＋1) と表せる。','4mn＝4×(2mn) と表せる。'],'「4×整数」の形になっています。'),
 S('整数であることを説明する','mn は整数だから、4mn は4の倍数である。',['mn は必ず偶数だから、4mn は4の倍数である。','mn は整数だから、4mn は奇数である。','mn は自然数だから、4mn は4の倍数である。'],'整数どうしの積 mn は整数です。'),
 S('結論を述べる','したがって、偶数と偶数の積は4の倍数である。',['したがって、偶数と偶数の和は4の倍数である。','したがって、偶数と偶数の積は奇数である。','したがって、偶数と偶数の積は必ず8の倍数である。'],'必ず成り立つ範囲で結論を言います。')
],'積の中に4を見つける'),
P('b05','7の倍数の差','「7の倍数どうしの差は7の倍数である」ことを証明しよう。',[
 S('7の倍数を表す','m、n を整数とすると、2つの7の倍数は 7m、7n と表せる。',['m、n を整数とすると、2つの7の倍数は 7＋m、7＋n と表せる。','m、n を整数とすると、2つの7の倍数は 7m＋1、7n＋1 と表せる。','m、n を自然数とすると、すべての7の倍数が表せる。'],'7の倍数は「7×整数」です。'),
 S('差を計算する','その差は、7m－7n。',['その差は、7m＋7n。','その差は、7mn。','その差は、7m－n。'],'「差」は前の数から後の数を引きます。'),
 S('7の倍数の形にする','7m－7n＝7(m－n)。',['7m－7n＝7(m＋n)。','7m－7n＝7(mn)。','7m－7n＝7(m－n＋1)。'],'7をくくり出します。'),
 S('整数の条件を使う','m－n は整数だから、7(m－n) は7の倍数である。',['m－n は必ず自然数だから、7(m－n) は7の倍数である。','m－n は整数だから、7(m－n) は7の余り1の数である。','m－n は必ず正だから、7(m－n) は7の倍数である。'],'差が負でも0でも、整数なら倍数として扱えます。'),
 S('結論を述べる','したがって、7の倍数どうしの差は7の倍数である。',['したがって、7の倍数どうしの差は7の倍数ではない。','したがって、7の倍数どうしの差は必ず正である。','したがって、7の倍数どうしの積は7の倍数である。'],'示すべき結論を明記します。')
],'倍数＝その数×整数'),

const $=id=>document.getElementById(id);
const make=(tag,cl,txt)=>{const node=document.createElement(tag);if(cl)node.className=cl;if(txt!==undefined)node.textContent=txt;return node};
const button=(txt,cl,fn)=>{const b=make('button',cl,txt);b.type='button';b.addEventListener('click',fn);return b};
const persistKey='shoumei-builder-v2-progress';
const fresh=()=>({build:{basic:[],advanced:[]},find:{basic:[],advanced:[]}});
function load(){try{const x=JSON.parse(localStorage.getItem(persistKey));if(x&&x.build&&x.find&&Array.isArray(x.build.basic)&&Array.isArray(x.find.advanced))return x;}catch(e){}return fresh()}
let progress=load();
const state={mode:'build',level:'basic',index:0,step:0,misses:0,guesses:[],found:false,notice:'',noticeTone:'',showList:false,seed:0};
const dataset=()=>state.mode==='build'?PROOFS[state.level]:ERRORS[state.level];
const item=()=>dataset()[state.index];
const solved=()=>progress[state.mode][state.level];
const isDone=()=>solved().includes(item().id);
function save(){try{localStorage.setItem(persistKey,JSON.stringify(progress))}catch(e){}}
function markDone(){if(!isDone()){solved().push(item().id);save()}}
function initQuestion(){state.step=0;state.misses=0;state.guesses=[];state.found=false;state.notice='';state.noticeTone='';state.seed+=1;state.showList=false;render()}
function switchMode(mode){if(state.mode===mode)return;state.mode=mode;state.index=0;initQuestion()}
function switchLevel(level){if(state.level===level)return;state.level=level;state.index=0;initQuestion()}
function go(i){const count=dataset().length;state.index=(i+count)%count;initQuestion()}
function next(){go(state.index+1)}
function nav(){const row=make('div','navrow');const l=make('div','miniNav');const prev=button('← 前の問題','lightbtn',()=>go(state.index-1));const nxt=button('次の問題 →','lightbtn',next);l.append(prev,nxt);const list=button(state.showList?'一覧を閉じる':'問題一覧','lightbtn',()=>{state.showList=!state.showList;render()});row.append(l,list);return row}
function listView(){const wrapper=make('div');wrapper.append(make('p','listLabel','解きたい問題を選んでください。✓ はクリア済み。'));const x=make('div','questionList');dataset().forEach((d,i)=>{const done=solved().includes(d.id);const b=button((done?'✓ ':'')+String(i+1).padStart(2,'0'), 'qchip'+(i===state.index?' current':'')+(done?' solved':''),()=>go(i));b.title=d.title;b.setAttribute('aria-label',`第${i+1}問 ${d.title}${done?' クリア済み':''}`);x.append(b)});wrapper.append(x);return wrapper}
function orderedOptions(step,stepIndex){const arr=[{text:step.correct,good:true},...step.wrong.map(w=>({text:w,good:false}))];let n=(state.index+1)*101+(stepIndex+1)*37+(state.level==='advanced'?19:0);for(let i=arr.length-1;i>0;i--){n=(n*1664525+1013904223)>>>0;const j=n%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr}
function notice(t,kind=''){state.notice=t;state.noticeTone=kind}
function onBuildChoice(v){const d=item(),s=d.steps[state.step];if(v.good){state.step++;notice(`正解！ ${s.why}`,'good');if(state.step>=d.steps.length){markDone()} }else{state.misses++;notice(`その文章では証明がつながりません。${s.why}`,'bad')}render()}
function onFindChoice(i){if(state.found)return;const d=item();if(i===d.wrong){state.found=true;markDone();notice(`発見！ 誤りは ${i+1} 行目です。${d.reason}`,'good')}else{state.misses++;state.guesses.push(i);notice(`${i+1}行目は正しい内容です。ほかの行を見比べよう。`,'bad')}render()}
function updateHeader(){ $('modeBuild').classList.toggle('active',state.mode==='build');$('modeFind').classList.toggle('active',state.mode==='find');$('levelBasic').classList.toggle('active',state.level==='basic');$('levelAdvanced').classList.toggle('active',state.level==='advanced');for(const id of ['modeBuild','modeFind','levelBasic','levelAdvanced'])$(id).setAttribute('aria-pressed',$(id).classList.contains('active')?'true':'false');$('stats').textContent=`${state.mode==='build'?'証明完成':'誤り発見'} ${solved().length} / ${dataset().length} 問`}
function renderLeft(){const p=$('leftPanel');p.replaceChildren();const d=item();const overview=state.mode==='build'?'証明をつくる':'間違いを見抜く';p.append(make('div','overline',`LEVEL ${state.level==='basic'?'1 ・ 基礎':'2 ・ 発展'}　/　第${state.index+1}問（全${dataset().length}問）`));p.append(make('h2','questionTitle',d.title));p.append(make('div','statement',d.statement));p.append(nav());if(state.showList)p.append(listView());if(state.mode==='build')renderBuildLeft(p,d);else renderFindLeft(p,d)}
function renderBuildLeft(p,d){if(state.step>=d.steps.length){const x=make('div','congrats');x.append(make('div','symbol','✦'),make('h3','','証明完成！'),make('p','','文字の表し方 → 計算 → 倍数の形 → 整数の理由 → 結論まで、証明がつながりました。'));p.append(x);p.append(make('div','tipBox',`注目：${d.focus}。右側の完成した証明を読んで、理由が説明できるか確かめましょう。`));const a=make('div','actions');a.append(button('同じ問題をもう一度','lightbtn',()=>initQuestion()),button(state.index===dataset().length-1?'第1問へ →':'次の問題へ →','primary green',next));p.append(a);return}
 const s=d.steps[state.step];const head=make('div','stepHead');head.append(make('span','stepBadge',`STEP ${state.step+1} / ${d.steps.length}`),make('span','caption',`ミス ${state.misses} 回`));p.append(head);p.append(make('h3','stepPrompt',s.label));const cs=make('div','choices');orderedOptions(s,state.step).forEach((o,i)=>{const b=button('', 'choice',()=>onBuildChoice(o));b.append(make('span','letter','ABCD'[i]),make('span','',o.text));cs.append(b)});p.append(cs);const fb=make('div','feedback'+(state.noticeTone?' '+state.noticeTone:''),state.notice||'証明の流れに合う文章を1つ選ぼう。正しい文章は右側に追加されます。');fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');p.append(fb);const a=make('div','actions');a.append(make('span','caption','問題はいつでも選び直せます。'),button('この問題を最初から','lightbtn',()=>initQuestion()));p.append(a)}
function renderFindLeft(p,d){const head=make('div','stepHead');head.append(make('span','stepBadge',`証明を読む ・ 全${d.lines.length}行`),make('span','caption',`ミス ${state.misses} 回`));p.append(head);p.append(make('h3','stepPrompt',state.found?'間違いを見つけました！':'右の証明から、おかしい1行をタップしよう。'));const tip=make('div','tipBox');tip.append(make('b','','どこを見る？　'),document.createTextNode('文字の条件／式の計算／倍数の形／最後の結論を、順番に確認しましょう。'));p.append(tip);const fb=make('div','feedback'+(state.noticeTone?' '+state.noticeTone:''),state.notice||'この証明には、間違っている行がちょうど1か所あります。右の行をタップして指摘してください。');fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');p.append(fb);if(state.found){const x=make('div','explain');x.append(make('h3','','正しい書き方'),make('div','repair',d.fix),make('p','',d.reason));p.append(x)}const a=make('div','actions');a.append(button('もう一度見る','lightbtn',initQuestion),button('次の問題へ →','primary'+(state.found?' green':''),next));p.append(a)}
function renderRight(){const d=item(),paper=$('paperBody');paper.replaceChildren();const build=state.mode==='build';$('paperTitle').textContent=build?'組み立て中の証明':'どこが間違い？';$('paperSub').textContent=build?'正しい選択をするたび、証明が1行ずつ完成します。':'証明を読み、誤っている「1行」を選んでください。';$('paperCount').textContent=build?`${state.step} / ${d.steps.length} 行`:`全 ${d.lines.length} 行`;const mark=make('div','paperMark');mark.append(make('span','',build?'MY PROOF NOTE':'PROOF CHECK'),make('span','',build?'COMPLETE YOUR PROOF':'FIND ONE ERROR'));paper.append(mark);if(build){d.steps.forEach((step,i)=>{const cls=i<state.step?'proofline done':i===state.step?'proofline next':'proofline blank';const x=make('div',cls);x.append(make('span','num',i<state.step?'✓':String(i+1)),make('span','',i<state.step?step.correct:i===state.step?`［${step.label}］ 次に選ぶ文章`:'…'));paper.append(x) });$('paperFooter').replaceChildren(make('strong','','証明のチェック　'),document.createTextNode('文字の条件 → 式の変形 → 整数である理由 → 結論を意識しよう。'));}else{d.lines.forEach((line,i)=>{let cls='proofline errorPick';if(state.guesses.includes(i))cls+=' wrongGuess';if(state.found&&i===d.wrong)cls+=' revealed';const x=button('',cls,()=>onFindChoice(i));x.disabled=state.found;x.setAttribute('aria-label',`${i+1}行目：${line}`);x.append(make('span','num',String(i+1)),make('span','',line));if(!state.found)x.append(make('span','pickIcon','⌕'));paper.append(x)});$('paperFooter').replaceChildren(make('strong','','間違い探しのコツ　'),document.createTextNode('ほかの行が正しくても、1行に論理の飛躍や条件の誤りがあれば証明は成り立ちません。'))}}
function render(){updateHeader();renderLeft();renderRight()}
$('modeBuild').addEventListener('click',()=>switchMode('build'));
$('modeFind').addEventListener('click',()=>switchMode('find'));
$('levelBasic').addEventListener('click',()=>switchLevel('basic'));
$('levelAdvanced').addEventListener('click',()=>switchLevel('advanced'));
// 起動前の教材チェック: 問題数、選択肢、誤り行の範囲と重複を検証する。
function verifyData(){for(const level of ['basic','advanced']){for(const p of PROOFS[level]){if(!p.steps.length)throw Error('No steps: '+p.id);for(const [i,s] of p.steps.entries()){const a=[s.correct,...s.wrong];if(a.length!==4||new Set(a).size!==4)throw Error('Bad options '+p.id+' step '+i)}}for(const p of ERRORS[level]){if(p.wrong<0||p.wrong>=p.lines.length||!p.fix||!p.reason)throw Error('Bad error '+p.id)}}}
verifyData();render();
</script>
</body>
