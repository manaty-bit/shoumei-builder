<header class="top"><div class="top-inner"><div class="identity"><div class="logo">Σ</div><div><h1>証明ビルダー</h1><p class="tagline">文字の置き方から証明の流れまで、ボタンで学ぼう。</p></div></div><div class="top-aux"><span class="vtag">CLICK & LEARN / VER.4</span><button class="topbtn" id="recordBtn">学習記録</button></div></div></header>
<div class="controls"><div class="controls-inner"><div class="sets"><div class="seg" role="group" aria-label="モード"><button id="buildTab" aria-pressed="true">✓ 証明をつくる</button><button id="findTab" aria-pressed="false">⌕ 間違いを見抜く</button></div><div class="seg level" role="group" aria-label="難易度"><button id="basicTab">LEVEL 1 基礎</button><button id="advancedTab">LEVEL 2 発展</button></div></div><span class="smallstats" id="stats"></span></div></div>
<main class="container"><nav id="stagebar" class="stagebar" aria-label="証明の練習段階"></nav><div class="workspace"><section class="card"><div class="card-body" id="problem"></div></section><section class="card"><div class="work-head"><div><h2 id="workTitle"></h2><p id="workDesc"></p></div><span class="count" id="workCount"></span></div><div class="work-body" id="work"></div></section></div></main><footer class="footer">文字の置き方・式変形・証明の順序を、すべてボタンで学べます。記録はこの端末内に保存されます。</footer>
</div><div id="modalRoot"></div>
<script>
const S=(label,correct,wrong,why)=>({label,correct,wrong,why});
const P=(id,title,statement,steps,focus)=>({id,title,statement,steps,focus});
const PROOFS={
basic:[
P('b01','奇数 ＋ 奇数','「奇数と奇数の和は偶数である」ことを証明しよう。',[
 S('文字で奇数を表す','m、n を整数とすると、2つの奇数は 2m＋1、2n＋1 と表せる。',['m、n を整数とすると、2つの奇数は 2m、2n と表せる。','n を整数とすると、2つの奇数は 2n＋1、2n＋1 と表せる。','m、n を正の整数とすると、すべての奇数は 2m＋1、2n＋1 と表せる。'],'2つの奇数をそれぞれ表すために m、n の2つの文字を使います。m＝n の場合もあります。'),
 S('和を計算する','その和は、(2m＋1)＋(2n＋1)＝2m＋2n＋2。',['その和は、(2m＋1)＋(2n＋1)＝2m＋2n＋1。','その和は、(2m＋1)＋(2n＋1)＝4mn＋2。','その和は、(2m＋1)＋(2n＋1)＝2m＋2n。'],'同類項をまとめると、定数部分は 1＋1＝2 です。'),
 S('偶数の形にする','2m＋2n＋2＝2(m＋n＋1)。',['2m＋2n＋2＝2(m＋n＋2)。','2m＋2n＋2＝2(m＋n)＋1。','2m＋2n＋2＝2(mn＋1)。'],'「2×整数」の形にくくります。'),
 S('整数であることを説明する','m＋n＋1 は整数だから、2(m＋n＋1) は偶数である。',['m＋n＋1 は必ず奇数だから、和は偶数である。','m＋n＋1 は必ず正の整数だから、和は偶数である。','m＋n＋1 は整数だから、2(m＋n＋1) は奇数である。'],'m、n が整数なら、m＋n＋1 も整数です。'),
 S('結論を述べる','したがって、奇数と奇数の和は偶数である。',['したがって、奇数と奇数の積は偶数である。','したがって、奇数と奇数の和は奇数である。','したがって、奇数と奇数の和は4の倍数である。'],'最初に証明したかったことを、正確に書きます。')
],'別々の奇数には別々の文字'),
P('b02','奇数 ＋ 偶数','「奇数と偶数の和は奇数である」ことを証明しよう。',[
 S('奇数と偶数を表す','m、n を整数とすると、奇数は 2m＋1、偶数は 2n と表せる。',['m、n を整数とすると、奇数は 2m、偶数は 2n＋1 と表せる。','m、n を整数とすると、奇数も偶数も 2m＋1 と表せる。','m、n を正の整数とすると、すべての奇数・偶数を表せる。'],'奇数は「2×整数＋1」、偶数は「2×整数」です。'),
 S('和を計算する','その和は、(2m＋1)＋2n＝2m＋2n＋1。',['その和は、(2m＋1)＋2n＝4mn＋1。','その和は、(2m＋1)＋2n＝2m＋2n＋2。','その和は、(2m＋1)＋2n＝2(m＋n)。'],'展開してから偶数の部分をまとめます。'),
 S('奇数の形にする','2m＋2n＋1＝2(m＋n)＋1。',['2m＋2n＋1＝2(m＋n＋1)。','2m＋2n＋1＝2(mn)＋1。','2m＋2n＋1＝2(m＋n＋1)＋1。'],'2k＋1（k は整数）の形を目指します。'),
 S('整数の条件を使う','m＋n は整数だから、2(m＋n)＋1 は奇数である。',['m＋n は偶数だから、2(m＋n)＋1 は奇数である。','m＋n は整数だから、2(m＋n)＋1 は偶数である。','m＋n は正の整数だから、2(m＋n)＋1 は奇数である。'],'m＋n は整数ですが、偶数とは限りません。'),
 S('結論を述べる','したがって、奇数と偶数の和は奇数である。',['したがって、奇数と偶数の和は偶数である。','したがって、奇数と偶数の積は奇数である。','したがって、奇数と偶数の和は3の倍数である。'],'結論は問題文と一致させます。')
],'奇数の形 2k＋1'),
P('b03','偶数 ＋ 偶数','「偶数と偶数の和は偶数である」ことを証明しよう。',[
 S('2つの偶数を表す','m、n を整数とすると、2つの偶数は 2m、2n と表せる。',['m、n を整数とすると、2つの偶数は 2m＋1、2n＋1 と表せる。','n を整数とすると、2つの偶数はどちらも 2n と表せる。','m、n を自然数とすると、すべての偶数は 2m、2n と表せる。'],'負の偶数や0も含むため、文字は整数とします。'),
 S('和を計算する','2つの偶数の和は、2m＋2n。',['2つの偶数の和は、2mn。','2つの偶数の和は、2m＋n。','2つの偶数の和は、4m＋n。'],'和と積を取り違えないようにします。'),
 S('偶数の形にする','2m＋2n＝2(m＋n)。',['2m＋2n＝2mn。','2m＋2n＝4(m＋n)。','2m＋2n＝2(m＋n＋1)。'],'共通な2でくくります。'),
 S('整数であることを説明する','m＋n は整数だから、2(m＋n) は偶数である。',['m＋n は奇数だから、2(m＋n) は偶数である。','m＋n は整数だから、2(m＋n) は奇数である。','m＋n は必ず正の整数だから、2(m＋n) は偶数である。'],'整数を2倍した数が偶数です。'),
 S('結論を述べる','したがって、偶数と偶数の和は偶数である。',['したがって、偶数と偶数の和は奇数である。','したがって、偶数と偶数の積は4の倍数である。','したがって、偶数と偶数の和は4の倍数である。'],'今回示したのは「和」についてです。')
],'偶数は 2×整数'),
P('b04','偶数 × 偶数','「偶数と偶数の積は4の倍数である」ことを証明しよう。',[
 S('2つの偶数を表す','m、n を整数とすると、2つの偶数は 2m、2n と表せる。',['m、n を整数とすると、2つの偶数は m＋2、n＋2 と表せる。','m、n を整数とすると、2つの偶数は 2m＋1、2n＋1 と表せる。','n を整数とすると、2つの偶数は必ず同じ 2n である。'],'別々の偶数を2m、2nと表します。'),
 S('積を計算する','その積は、2m×2n＝4mn。',['その積は、2m×2n＝2mn。','その積は、2m×2n＝4(m＋n)。','その積は、2m×2n＝4m＋4n。'],'係数は 2×2＝4、文字は mn になります。'),
 S('4の倍数の形を確認する','4mn＝4×(mn) と表せる。',['4mn＝4×(m＋n) と表せる。','4mn＝4×(m＋n＋1) と表せる。','4mn＝4×(2mn) と表せる。'],'「4×整数」の形になっています。'),
 S('整数であることを説明する','mn は整数だから、4mn は4の倍数である。',['mn は必ず偶数だから、4mn は4の倍数である。','mn は整数だから、4mn は奇数である。','mn は自然数だから、4mn は4の倍数である。'],'整数どうしの積 mn は整数です。'),

],'積の中に4を見つける'),
P('b05','7の倍数の差','「7の倍数どうしの差は7の倍数である」ことを証明しよう。',[
 S('7の倍数を表す','m、n を整数とすると、2つの7の倍数は 7m、7n と表せる。',['m、n を整数とすると、2つの7の倍数は 7＋m、7＋n と表せる。','m、n を整数とすると、2つの7の倍数は 7m＋1、7n＋1 と表せる。','m、n を自然数とすると、すべての7の倍数が表せる。'],'7の倍数は「7×整数」です。'),
 S('差を計算する','その差は、7m－7n。',['その差は、7m＋7n。','その差は、7mn。','その差は、7m－n。'],'「差」は前の数から後の数を引きます。'),
 S('7の倍数の形にする','7m－7n＝7(m－n)。',['7m－7n＝7(m＋n)。','7m－7n＝7(mn)。','7m－7n＝7(m－n＋1)。'],'7をくくり出します。'),
 S('整数の条件を使う','m－n は整数だから、7(m－n) は7の倍数である。',['m－n は必ず自然数だから、7(m－n) は7の倍数である。','m－n は整数だから、7(m－n) は7の余り1の数である。','m－n は必ず正だから、7(m－n) は7の倍数である。'],'差が負でも0でも、整数なら倍数として扱えます。'),
 S('結論を述べる','したがって、7の倍数どうしの差は7の倍数である。',['したがって、7の倍数どうしの差は7の倍数ではない。','したがって、7の倍数どうしの差は必ず正である。','したがって、7の倍数どうしの積は7の倍数である。'],'示すべき結論を明記します。')
],'倍数＝その数×整数'),
P('b06','連続する3つの整数','「連続する3つの整数の和は3の倍数である」ことを証明しよう。',[
 S('連続する3つの整数を表す','n を整数とすると、連続する3つの整数は n、n＋1、n＋2 と表せる。',['n を整数とすると、連続する3つの整数は n、n＋1、n＋3 と表せる。','n を整数とすると、連続する3つの整数は n、2n、3n と表せる。','n を正の整数とすると、すべての連続する3つの整数を表せる。'],'1ずつ増えるのが「連続する整数」です。'),
 S('和を計算する','その和は、n＋(n＋1)＋(n＋2)＝3n＋3。',['その和は、n＋(n＋1)＋(n＋2)＝3n＋2。','その和は、n＋(n＋1)＋(n＋2)＝n³＋3。','その和は、n＋(n＋1)＋(n＋2)＝3n＋1。'],'文字nが3個、定数部分は 0＋1＋2＝3。'),
 S('3の倍数の形にする','3n＋3＝3(n＋1)。',['3n＋3＝3(n＋3)。','3n＋3＝3n(n＋1)。','3n＋3＝3(n＋2)。'],'3でくくり出します。'),
 S('整数の条件を使う','n＋1 は整数だから、3(n＋1) は3の倍数である。',['n＋1 は必ず3の倍数だから、3(n＋1) は3の倍数である。','n＋1 は整数だから、3(n＋1) は奇数である。','n＋1 は必ず正の整数だから、3(n＋1) は3の倍数である。'],'nが整数なら n＋1 も整数です。'),
 S('結論を述べる','したがって、連続する3つの整数の和は3の倍数である。',['したがって、連続する3つの整数の和は必ず6の倍数である。','したがって、連続する3つの整数の積は3の倍数である。','したがって、連続する3つの整数の和は奇数である。'],'どの整数から始めても成り立つことを示せました。')
],'連続する整数は +1ずつ'),
P('b07','連続する5つの整数','「連続する5つの整数の和は5の倍数である」ことを証明しよう。',[
 S('真ん中の整数を決める','n を整数とすると、5つの整数は n－2、n－1、n、n＋1、n＋2 と表せる。',['n を整数とすると、5つの整数は n－3、n－1、n、n＋1、n＋2 と表せる。','n を整数とすると、5つの整数は n、n＋2、n＋4、n＋6、n＋8 と表せる。','n を整数とすると、5つの整数は n－2、n－1、n、n＋1、n＋3 と表せる。'],'真ん中をnとすると、左右が対称になります。'),
 S('和を計算する','その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝5n。',['その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝5n＋2。','その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝5n＋5。','その和は、(n－2)＋(n－1)＋n＋(n＋1)＋(n＋2)＝n⁵。'],'定数の －2、－1、0、＋1、＋2 は打ち消し合います。'),
 S('5の倍数の形を見る','5n＝5×n と表せる。',['5n＝5＋n と表せる。','5n＝5×(n＋1) と表せる。','5n＝5×(n－1) と表せる。'],'すでに5×整数の形です。'),
 S('文字の条件を使う','n は整数だから、5n は5の倍数である。',['n は整数だから、5n は必ず奇数である。','n は必ず5の倍数だから、5n は5の倍数である。','n は正の整数だから、5n は5の倍数である。'],'nが負でも0でも成立します。'),
 S('結論を述べる','したがって、連続する5つの整数の和は5の倍数である。',['したがって、連続する5つの整数の和は必ず10の倍数である。','したがって、連続する5つの整数の和は必ず奇数である。','したがって、連続する5つの整数の積は5の倍数である。'],'「和」が5の倍数になることを示しました。')
],'真ん中をnにして対称に'),
P('b08','7で割った余り','「7で割ると余りが3の整数と、余りが4の整数の和は7の倍数になる」ことを証明しよう。',[
 S('余りのある整数を表す','m、n を整数とすると、2つの数は 7m＋3、7n＋4 と表せる。',['m、n を整数とすると、2つの数は 7m＋4、7n＋3 と表せる。','m、n を整数とすると、2つの数は 3m＋7、4n＋7 と表せる。','m、n を整数とすると、2つの数は 7m、7n と表せる。'],'「割る数×整数＋余り」を使います。'),

 S('7の倍数の形にする','7m＋7n＋7＝7(m＋n＋1)。',['7m＋7n＋7＝7(m＋n＋7)。','7m＋7n＋7＝7(m＋n)＋1。','7m＋7n＋7＝7(mn＋1)。'],'7でくくります。'),
 S('整数の条件を使う','m＋n＋1 は整数だから、7(m＋n＋1) は7の倍数である。',['m＋n＋1 は必ず7の倍数だから、和は7の倍数である。','m＋n＋1 は必ず正の整数だから、和は7の倍数である。','m＋n＋1 は整数だから、7(m＋n＋1) は余り1の整数である。'],'余りの和が7なら、全体は7の倍数です。'),
 S('結論を述べる','したがって、2つの整数の和は7の倍数になる。',['したがって、2つの整数の差は7の倍数になる。','したがって、2つの整数の和は余り7になる。','したがって、2つの整数の和は14の倍数になる。'],'余りは7より小さくなくてはいけません。')
],'余りを足して、倍数の形へ')

advanced:[
P('a01','2けたの数を入れ替えて足す','「2けたの自然数と、十の位・一の位の数字を入れ替えた数との和は11の倍数である」ことを証明しよう。',[
 S('各位の数字を表す','十の位の数字を a、一の位の数字を b とする。a は1以上9以下、b は0以上9以下の整数である。',['a、b はともに1以上9以下の整数である。','a、b はともに0以上10以下の整数である。','a は0以上9以下、b は1以上9以下の整数である。'],'十の位は0にできません。一の位は0でも構いません。'),
 S('元の整数を表す','元の2けたの自然数は 10a＋b と表せる。',['元の2けたの自然数は a＋10b と表せる。','元の2けたの自然数は 100a＋b と表せる。','元の2けたの自然数は 10(a＋b) と表せる。'],'十の位は10倍します。'),
 S('入れ替えた数を表す','数字を入れ替えた数は 10b＋a と表せる。',['数字を入れ替えた数は 10a＋b と表せる。','数字を入れ替えた数は 100b＋a と表せる。','数字を入れ替えた数は b＋10ab と表せる。'],'十の位がb、一の位がaになります。'),
 S('和を因数分解する','(10a＋b)＋(10b＋a)＝11a＋11b＝11(a＋b)。',['(10a＋b)＋(10b＋a)＝11a＋10b。','(10a＋b)＋(10b＋a)＝10(a＋b)。','(10a＋b)＋(10b＋a)＝11(a－b)。'],'11を共通因数にもつ形にします。'),
 S('結論まで書く','a＋b は整数だから、11(a＋b) は11の倍数である。したがって、求める和は11の倍数である。',['a＋b は必ず11の倍数だから、求める和は11の倍数である。','a＋b は整数だから、11(a＋b) は9の倍数である。','a－b は整数だから、求める和は11の倍数である。'],'最後に必ず「文字が整数」という理由を入れます。')

P('a02','2けたの数を入れ替えて引く','「2けたの自然数と、各位の数字を入れ替えた数との差は9の倍数である」ことを証明しよう。',[
 S('位の数字を決める','a は1以上9以下、b は0以上9以下の整数とし、十の位を a、一の位を b とする。',['a、b はともに0以上9以下の整数とする。','a、b はともに1以上10以下の整数とする。','a は0以上9以下、b は1以上9以下の整数とする。'],'元の数が2けたになるため、a は0ではありません。'),
 S('元の数と入れ替えた数を表す','元の数は 10a＋b、入れ替えた数は 10b＋a と表せる。',['元の数は a＋b、入れ替えた数は b＋a と表せる。','元の数は 10a＋b、入れ替えた数は 10a＋b と表せる。','元の数は 10a＋b、入れ替えた数は 100b＋a と表せる。'],'各位の数字の位置に着目します。'),

 S('9の倍数の形にする','10a＋b－10b－a＝9a－9b＝9(a－b)。',['10a＋b－10b－a＝9(a＋b)。','10a＋b－10b－a＝9(a－b)＋1。','10a＋b－10b－a＝9(a－10b)。'],'差の形では a－b が残ります。'),
 S('理由と結論をまとめる','a－b は整数だから、9(a－b) は9の倍数である。したがって、求める差は9の倍数である。',['a－b は必ず正の整数だから、求める差は9の倍数である。','a－b は整数だから、求める差は11の倍数である。','a＋b は整数だから、求める差は9の倍数である。'],'差が負の場合も、9の倍数に含みます。')
],'マイナスの分配に注意'),
P('a03','3けたの百・十の位を入れ替える','「3けたの整数と、その百の位・十の位を入れ替えた数との差は90の倍数である」ことを証明しよう。',[
 S('3つの位の数字を決める','百の位を a、十の位を b、一の位を c とする。a は1以上9以下、b、c は0以上9以下の整数である。',['a、b、c はすべて0以上9以下の整数である。','a、b、c はすべて1以上9以下の整数である。','a は0以上9以下、b は1以上9以下、c は0以上9以下の整数である。'],'3けたであるため、百の位のaだけは0を除きます。'),

 S('位を入れ替えた数を表す','入れ替えた数は 100b＋10a＋c と表せる。',['入れ替えた数は 100c＋10b＋a と表せる。','入れ替えた数は 100a＋10c＋b と表せる。','入れ替えた数は 100b＋10c＋a と表せる。'],'百の位と十の位だけを交換します。'),

 S('理由と結論を述べる','a－b は整数だから、90(a－b) は90の倍数である。したがって、求める差は90の倍数である。',['a－b は必ず自然数だから、求める差は90の倍数である。','a＋b は整数だから、求める差は90の倍数である。','a－b は整数だから、求める差は9の倍数でしかない。'],'整数の差は整数です。')
],'100と10の差は90'),

 S('文字と条件を決める','百の位を a、十の位を b、一の位を c とする。a は1以上9以下、b、c は0以上9以下の整数である。',['a、b、c はすべて0以上9以下の整数である。','a、b、c はすべて1以上9以下の整数である。','a は0以上9以下、b、c は1以上9以下の整数である。'],'数字の条件を正しく指定します。'),
 S('整数と数字の和を表す','元の整数は 100a＋10b＋c、各位の数字の和は a＋b＋c である。',['元の整数は 100a＋10b＋c、各位の数字の和は 100a＋10b＋c である。','元の整数は 10a＋100b＋c、各位の数字の和は a＋b＋c である。','元の整数は 100a＋10b＋c、各位の数字の和は ab＋c である。'],'数字そのものの和は a＋b＋c。'),

],'100＝99＋1、10＝9＋1'),

'use strict';
const $=id=>document.getElementById(id);
function make(tag,cl,txt){const e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e}
function btn(txt,cls,fn){const b=make('button',cls,txt);b.type='button';b.addEventListener('click',fn);return b}
const LEVELS=['basic','advanced'];
const PHASES=[{label:'証明をつくる',sub:'文字の置き方→式→理由→結論'},{label:'順番チャレンジ',sub:'選択肢の順序を自分で考える'}];
const STORE='shoumei-builder-v4-buttons';
function empty(){return{build:{basic:{},advanced:{}},find:{basic:{},advanced:{}}}}
function load(){try{const p=JSON.parse(localStorage.getItem(STORE));if(p?.build?.basic&&p?.build?.advanced&&p?.find?.basic&&p?.find?.advanced)return p}catch(e){}return empty()}
let progress=load();function save(){try{localStorage.setItem(STORE,JSON.stringify(progress))}catch(e){}}
const state={mode:'build',level:'basic',phase:1,index:0,step:0,wrong:0,hints:0,feedback:'',tone:'',showList:false,showGuide:false,showHint:false,errorStep:'point',retry:0,practice:false};
const dataset=()=>state.mode==='build'?PROOFS[state.level]:ERRORS[state.level];
const cur=()=>dataset()[state.index];
const bk=(id=cur().id,lvl=state.level)=>progress.build[lvl][id]||{};
const fk=(id=cur().id,lvl=state.level)=>progress.find[lvl][id]||{};
function completed(){return state.mode==='build'?!!bk()[state.phase===1?'guided':'order']&&!state.practice:!!fk().date&&!state.practice}
function markBuild(){const d=cur(),record=progress.build[state.level][d.id]||{};record[state.phase===1?'guided':'order']={date:new Date().toISOString(),misses:state.wrong,hints:state.hints};progress.build[state.level][d.id]=record;state.practice=false;save();render()}
function markFind(){const d=cur();progress.find[state.level][d.id]={date:new Date().toISOString(),misses:state.wrong};state.practice=false;save();render()}
function advance(mode=state.mode,level=state.level,index=state.index,phase=state.phase){Object.assign(state,{mode,level,index,phase,step:0,wrong:0,hints:0,feedback:'',tone:'',showList:false,showGuide:false,showHint:false,errorStep:'point',retry:state.retry+1,practice:false});render()}
function redo(){advance();state.practice=true;render()}
function gotoQ(i){const list=dataset();advance(state.mode,state.level,(i+list.length)%list.length,1)}
function nextQ(){gotoQ(state.index+1)}
function ordered(arr,salt=0){const out=[...arr];let seed=(((state.index+1)*2917+(state.retry+1)*773+(state.level==='basic'?109:907)+(state.phase+3)*281+salt)*2654435761)>>>0;for(let i=out.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}
function setFeedback(msg,tone=''){state.feedback=msg;state.tone=tone;render()}
function feedback(fallback){const e=make('div','feedback'+(state.tone?' '+state.tone:''),state.feedback||fallback);e.setAttribute('role','status');e.setAttribute('aria-live','polite');return e}
function choiceButton(label,i,fn){const b=btn('','choice',fn);b.append(make('span','letter',String.fromCharCode(65+i)),make('span','',label));return b}
function completeRate(level){return {build:PROOFS[level].filter(x=>progress.build[level][x.id]?.guided).length,order:PROOFS[level].filter(x=>progress.build[level][x.id]?.order).length,find:ERRORS[level].filter(x=>progress.find[level][x.id]?.date).length,buildTotal:PROOFS[level].length,findTotal:ERRORS[level].length}}
function renderHeader(){for(const [id,on] of [['buildTab',state.mode==='build'],['findTab',state.mode==='find'],['basicTab',state.level==='basic'],['advancedTab',state.level==='advanced']]){$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',String(on))}const s=completeRate(state.level);$('stats').textContent=`証明 ${s.build}/${s.buildTotal} ｜ 順番チャレンジ ${s.order}/${s.buildTotal} ｜ 誤り探し ${s.find}/${s.findTotal}`}
function stagebar(){const h=$('stagebar');h.replaceChildren();if(state.mode==='find'){['① 誤りの行','② 理由を選ぶ','③ 正しく直す'].forEach((label,i)=>{const index=['point','reason','repair','done'].indexOf(state.errorStep);const x=make('div','stage'+(index===i?' active':'')+(index>i?' done':''));x.append(make('span','stage-n',String(i+1)),make('div','',label));h.append(x)});return}PHASES.forEach((p,i)=>{const j=i+1,done=!!bk()[j===1?'guided':'order'];const b=btn('','stage'+(j===state.phase?' active':'')+(done?' done':''),()=>advance(state.mode,state.level,state.index,j));b.append(make('span','stage-n',done?'✓':String(j)));const label=make('div');label.append(make('strong','',p.label),make('small','',p.sub));b.append(label);h.append(b)})}
function renderProblem(){const d=cur(),host=$('problem');host.replaceChildren();host.append(make('p','sectiontitle',`${state.mode==='build'?'証明をつくる':'間違いを見抜く'} / ${state.level==='basic'?'LEVEL 1 基礎':'LEVEL 2 発展'} / ${state.index+1}問目`));host.append(make('h2','title',d.title));host.append(make('div','statement',d.statement));const diagram=diagramFor(d.id,false);if(diagram)host.append(diagram);
const nav=make('div','nav'),group=make('div','nav-group');group.append(btn('← 前の問題','subbtn',()=>gotoQ(state.index-1)),btn('次の問題 →','subbtn',nextQ));nav.append(group,btn(state.showList?'一覧を閉じる':'問題一覧','subbtn',()=>{state.showList=!state.showList;renderProblem()}));host.append(nav);
if(state.showList){const list=make('div','problem-list');dataset().forEach((x,i)=>{const done=state.mode==='build'?!!progress.build[state.level][x.id]?.guided:!!progress.find[state.level][x.id]?.date;const b=btn((done?'✓ ':'')+String(i+1).padStart(2,'0'),'qnum'+(i===state.index?' active':'')+(done?' complete':''),()=>gotoQ(i));b.title=x.title;list.append(b)});host.append(list)}
if(state.mode==='build'){const guide=make('div','guide'),details=make('details');details.open=state.showGuide;details.addEventListener('toggle',()=>state.showGuide=details.open);details.append(make('summary','','基本の文字式を確認する'));details.append(make('p','','偶数：2n、奇数：2n＋1（n は整数）。正の奇数：2n－1（n は正の整数）。2けた：10a＋b（a は1～9、b は0～9の整数）。3けた：100a＋10b＋c（a は1～9、b・c は0～9の整数）。数字の入れ替え後に先頭が0になる場合も、数として扱います。'));guide.append(details);host.append(guide)}else host.append(make('div','hint','計算ミスだけでなく、文字の条件や「なぜ整数と言えるか」に着目しよう。最後の修正もボタンで選べます。'))}
function renderProofLines(host,d,count){const wrap=make('div','proof-note');wrap.append(make('div','note-title','ここまでの証明'));d.steps.forEach((s,i)=>{const ok=i<count;const item=make('div','proof-line '+(ok?'done':i===count?'next':'gray'));item.append(make('span','num',ok?'✓':String(i+1)),make('span','',ok?s.correct:(i===count?`［次はどんな内容？］`:'…')));wrap.append(item)});host.append(wrap)}
function doneView(host,isBuild){const d=cur(),x=make('div','success');x.append(make('div','star','✦'),make('h3','',isBuild?'証明が完成！':'誤りを修復！'),make('p','',isBuild?'文字の表し方、式の変形、整数である理由、結論を順に確認しました。':'誤りの場所・理由・修正方法まで正しく選べました。'));host.append(x);
const row=make('div','actionrow');row.append(btn('もう一度挑戦','subbtn',redo));if(isBuild&&state.phase===1)row.append(btn('順番チャレンジへ →','primary good',()=>advance(state.mode,state.level,state.index,2)));else row.append(btn('次の問題へ →','primary good',nextQ));host.append(row);if(isBuild&&state.phase===1)host.append(make('p','emptyhint','順番チャレンジは任意です。ここで次の問題に進んでもOK。'));if(isBuild)host.append(btn('次の問題に進む','subbtn',nextQ))}
function renderWork(){const host=$('work');host.replaceChildren();if(state.mode==='find')return renderFind(host);const d=cur();$('workTitle').textContent=PHASES[state.phase-1].label;$('workDesc').textContent=PHASES[state.phase-1].sub;$('workCount').textContent=`${state.step}/${d.steps.length}行`;
if(completed())return doneView(host,true);
if(state.step>=d.steps.length){markBuild();return}
if(state.phase===1)renderGuided(host,d);else renderOrder(host,d)}
function renderGuided(host,d){const s=d.steps[state.step];const meta=make('div','step-meta');meta.append(make('span','step-label',`STEP ${state.step+1} / ${d.steps.length}`),make('span','small muted',`ミス ${state.wrong}回`));host.append(meta);host.append(make('h3','prompt',s.label));if(state.step===0)host.append(make('div','feedback','最初は、数をどの文字で表すかが大切です。文字の条件にも注目しよう。'));
const list=make('div','choices');ordered([{txt:s.correct,correct:true},...s.wrong.map(txt=>({txt,correct:false}))],state.step*9).forEach((o,i)=>{list.append(choiceButton(o.txt,i,()=>{if(o.correct){state.step++;state.feedback='正解！ '+s.why;state.tone='good';renderWork()}else{state.wrong++;setFeedback(state.wrong%3===2?'ヒント：'+s.why:'もう一度。文字の範囲、式の計算、主張との対応を見直そう。','bad')}}))});host.append(list);host.append(feedback('正しい文章を選ぶと、証明ノートに追加されます。'));renderProofLines(host,d,state.step)}
function renderOrder(host,d){host.append(make('h3','prompt','次に書くべき一文を選ぼう！'));host.append(make('p','small muted','基本となる証明の順序を選ぼう。別の順序でも正しく書ける場合はあります。'));const remaining=d.steps.map((s,i)=>({txt:s.correct,idx:i})).filter(x=>x.idx>=state.step);const list=make('div','choices');ordered(remaining,state.step*31+4).forEach((o,i)=>{list.append(choiceButton(o.txt,i,()=>{if(o.idx===state.step){state.feedback=`正解！ ${d.steps[state.step].why}`;state.tone='good';state.step++;renderWork()}else{state.wrong++;setFeedback(state.wrong%3===2?`ヒント：次は「${d.steps[state.step].label}」の内容です。`:'証明はまだその段階ではありません。前の行とのつながりを考えよう。','bad')}}))});host.append(list);host.append(feedback('証明の流れを考えて、次の一文を選んでください。'));renderProofLines(host,d,state.step)}

function renderFind(host){const d=cur();$('workTitle').textContent='間違いを見抜く';$('workDesc').textContent='行を発見 → 理由 → 正しい修正を選ぶ';$('workCount').textContent=`${state.index+1}/${dataset().length}問`;
if(completed())return doneView(host,false);
if(state.errorStep==='point'){host.append(make('h3','prompt','間違っている1行を選ぼう。'));const lines=make('div');d.lines.forEach((line,i)=>{const b=btn('','proof-line clickable',()=>{if(i===d.wrong){state.errorStep='reason';state.feedback='誤りの行を発見！ 次は、なぜ間違いなのか考えよう。';state.tone='good';render()}else{state.wrong++;setFeedback('この行は誤りではありません。文字の条件と前後の式を読み直そう。','bad')}});b.append(make('span','num',String(i+1)),make('span','',line),make('span','meta','⌕'));lines.append(b)});host.append(lines);host.append(feedback('証明のなかに数学的に正しくない行が1か所あります。'));return}
if(state.errorStep==='reason'){host.append(make('h3','prompt','なぜ、この行が間違っている？'));host.append(make('div','proof-line revealed',`${d.wrong+1}行目　${d.lines[d.wrong]}`));const options=ordered([{txt:FIND_REASON[d.id],correct:true},...ordered(FIND_DISTRACTORS,99).slice(0,3).map(txt=>({txt,correct:false}))],133);const list=make('div','choices');options.forEach((o,i)=>list.append(choiceButton(o.txt,i,()=>{if(o.correct){state.errorStep='repair';state.feedback='理由も正解！ 正しい文章を選んで証明を修復しよう。';state.tone='good';render()}else{state.wrong++;setFeedback('ちがいます。計算・表し方・整数の条件のどれが問題かを考えよう。','bad')}})));host.append(list);host.append(feedback('誤りの理由を1つ選んでください。'));return}
host.append(make('h3','prompt','正しい1行に直そう！'));host.append(make('div','proof-line revealed',`修正前　${d.lines[d.wrong]}`));const choices=ordered([{txt:d.fix,correct:true},{txt:d.lines[d.wrong],correct:false},...FIX_DISTRACTORS[d.id].map(txt=>({txt,correct:false}))],191);const list=make('div','choices');choices.forEach((o,i)=>list.append(choiceButton(o.txt,i,()=>{if(o.correct){markFind()}else{state.wrong++;setFeedback(state.wrong%3===2?'考え方：'+d.reason:'その直し方では、まだ数学的に正しくありません。','bad')}})));host.append(list);host.append(feedback('修正後の文を選んでください。'));host.append(make('p','small muted','入力は必要ありません。修復できると次の問題に進めます。'))}

function diagramFor(id,isTransfer){if(!id.startsWith('a')||Number(id.slice(1))<9)return null;const wrap=make('div');wrap.append(make('p','chart-title','図の規則を読もう'));const chart=make('div','pattern');let note='';const mkTable=(rows,cols,value,highlight,headers)=>{const table=document.createElement('table');const body=document.createElement('tbody');if(headers){const tr=document.createElement('tr');tr.append(make('th','',''));for(let c=0;c<cols;c++)tr.append(make('th','',String(2*c+1)));body.append(tr)}for(let r=0;r<rows;r++){const tr=document.createElement('tr');if(headers)tr.append(make('th','',String(2*(r+1))));for(let c=0;c<cols;c++){let v=value(r,c);const td=make('td',highlight(r,c)?'hit':(v==null?'dim':''),v==null?'':String(v));tr.append(td)}body.append(tr)}table.append(body);return table};
 if(id==='a09'){chart.append(mkTable(4,6,(r,c)=>2*(6*r+c)+1,(r,c)=>(r===1||r===2)&&(c===1||c===2)));note='横に2、縦に12増える。色の4マスは例。'}
 if(id==='a10'){const cols=isTransfer?5:7;chart.append(mkTable(4,cols,(r,c)=>cols*r+c+1,(r,c)=>(r===1||r===2)&&(c===1||c===2)));note=`${cols}列ごとに次の段へ。色の4マスは例。`}
 if(id==='a11'){chart.append(mkTable(5,7,(r,c)=>{const val=r*7+c-1;return val>=1&&val<=31?val:null},(r,c)=>isTransfer?c===3&&(r===1||r===2||r===3):(r===1&&(c===2||c===3))||(r===2&&c===3)));note=isTransfer?'縦3マスを考える（同じ月に存在する位置）。':'右へ1、下へ7進むL字型。'}
 if(id==='a12'){const ns=4,unit=isTransfer?40:70,height=isTransfer?40:28;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${unit*ns+20} ${height*ns+25}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',`${ns}段まで積んだ階段状の${isTransfer?'正方形':'長方形'}`);for(let r=0;r<ns;r++){const count=r+1;for(let c=0;c<count;c++){const x=10+(ns-count)*unit/2+c*unit,y=10+r*height;const e=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of [['x',x],['y',y],['width',unit],['height',height],['fill','#f5f8ff'],['stroke','#3d608b'],['stroke-width','1.7']])e.setAttribute(k,v);svg.appendChild(e)}}chart.append(svg);note=isTransfer?'1cm×1cmの正方形で4段の例。':'横2cm・縦1cmの長方形で4段の例。'}
 if(id==='a13'){chart.append(mkTable(4,4,(r,c)=>2*(r+1)+2*(c+1)-1,(r,c)=>(r===1||r===2)&&(c===1||c===2),true));note='行・列ともに1つ進むと2増える。'}
 wrap.append(chart,make('p','diagram-note',note));return wrap}

function render(){renderHeader();stagebar();renderProblem();renderWork()}
function openRecords(){const host=$('modalRoot');host.replaceChildren();const cover=make('div','overlay'),dlg=make('div','dialog');dlg.setAttribute('role','dialog');dlg.setAttribute('aria-modal','true');dlg.setAttribute('aria-label','学習記録');dlg.append(make('h2','','証明ビルダー 学習記録'));dlg.append(make('p','','選択式の学習記録です。「白紙から証明を書けること」の合格判定ではありません。'));LEVELS.forEach(lvl=>{const s=completeRate(lvl);dlg.append(make('h3','',lvl==='basic'?'LEVEL 1 基礎':'LEVEL 2 発展'));const grid=make('div','kpi-grid');for(const [title,count,total] of [['証明をつくる',s.build,s.buildTotal],['順番チャレンジ',s.order,s.buildTotal],['間違いを修復',s.find,s.findTotal]]){const k=make('div','kpi');k.append(make('b','',`${count}/${total}`),make('span','',title));const line=make('div','progressline'),bar=make('span');bar.style.width=(100*count/total)+'%';line.append(bar);k.append(line);grid.append(k)}dlg.append(grid);if(s.build===s.buildTotal&&s.find===s.findTotal){dlg.append(make('p','hint','このレベルの基本の証明づくりと誤り修復を全問クリア！ 慣れてきたら、順番チャレンジにも挑戦してみよう。'))}});
const actions=make('div','actionrow');actions.append(btn('閉じる','primary',()=>host.replaceChildren()));dlg.append(actions);cover.append(dlg);cover.addEventListener('click',e=>{if(e.target===cover)host.replaceChildren()});host.append(cover)}
function validate(){for(const lvl of LEVELS){for(const d of PROOFS[lvl]){if(!d.steps?.length)throw Error('No proof: '+d.id);for(const s of d.steps){const arr=[s.correct,...s.wrong];if(arr.length!==4||new Set(arr).size!==4)throw Error('Invalid choices: '+d.id)}}for(const d of ERRORS[lvl]){if(d.wrong<0||d.wrong>=d.lines.length||!FIND_REASON[d.id])throw Error('Invalid error: '+d.id);const arr=[d.fix,d.lines[d.wrong],...(FIX_DISTRACTORS[d.id]||[])];if(arr.length!==4||new Set(arr).size!==4)throw Error('Invalid repair choices: '+d.id)}}}
$('buildTab').addEventListener('click',()=>advance('build',state.level,0,1));$('findTab').addEventListener('click',()=>advance('find',state.level,0,1));$('basicTab').addEventListener('click',()=>advance(state.mode,'basic',0,1));$('advancedTab').addEventListener('click',()=>advance(state.mode,'advanced',0,1));$('recordBtn').addEventListener('click',openRecords);
validate();render();
